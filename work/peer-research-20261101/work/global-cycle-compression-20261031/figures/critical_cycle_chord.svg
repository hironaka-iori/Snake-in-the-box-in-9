l,sans-serif" font-size="14" fill="#475569" text-anchor="middle">v=38</text><circle cx="360" cy="560" r="23" fill="#dbeafe" stroke="#334155"/><text x="360" y="566" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">14</text><text x="360" y="604" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569" text-anchor="middle">v=34</text><circle cx="210" cy="560" r="23" fill="#fecaca" stroke="#334155"/><text x="210" y="566" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">15</text><text x="210" y="604" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#475569" text-anchor="middle">v=32</text><rect x="120" y="439" width="180" height="42" rx="8" fill="#fff1f2"/><text x="210" y="467" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#b91c1c" text-anchor="middle">Forbidden chord</text><text x="710.0" y="661" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#b91c1c" text-anchor="middle">v0 = 0 and v15 = 32: distinct nonconsecutive vertices differing in coordinate 5.</text><text x="710.0" y="701" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">At step 16, v16 = 0 repeats the starting vertex. The 15-step prefix already fails inducedness.</text><text x="710.0" y="749" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#475569" text-anchor="middle">This proves a history exclusion. Other critical cycles and the full global upper bound remain unresolved.</text></svg>
ill="#b45309" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">mean = 480</text><rect x="1005" y="150" width="280" height="160" rx="8" fill="#1e3a8a"/><text x="1145" y="195" font-size="17" fill="white" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">+ three count exclusions</text><text x="1145" y="255" font-size="31" fill="white" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">2 SCCs</text><text x="1145" y="360" font-size="21" fill="#b45309" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">mean = 480</text><rect x="100" y="410" width="1100" height="100" rx="8" fill="#eef5fb"/><text x="650" y="450" font-size="21" fill="#0f172a" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">3 new count-core certificates: 353 + 1264 + 284 RUP steps</text><text x="650" y="485" font-size="17" fill="#0f172a" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">24 additional frozen critical records excluded; two large zero-slack components still survive.</text><text x="650" y="561" font-size="18" fill="#64748b" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">All figures describe the saved frozen subset, not a recomputation of the full current model.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="810" height="610" viewBox="0 0 810 610"><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="400" y="37" font-size="25" fill="#0f172a" text-anchor="middle">Counterexample to dropping off-chain cut vertices</text><line x1="200" y1="110" x2="350" y2="110" stroke="#dc2626" stroke-width="5"/><line x1="200" y1="110" x2="110" y2="230" stroke="#94a3b8" stroke-width="2"/><line x1="350" y1="110" x2="440" y2="230" stroke="#dc2626" stroke-width="5"/><line x1="440" y1="230" x2="350" y2="350" stroke="#dc2626" stroke-width="5"/><line x1="440" y1="230" x2="600" y2="230" stroke="#94a3b8" stroke-width="2"/><line x1="350" y1="350" x2="200" y2="350" stroke="#dc2626" stroke-width="5"/><line x1="200" y1="350" x2="110" y2="230" stroke="#94a3b8" stroke-width="2"/><line x1="200" y1="350" x2="200" y2="465" stroke="#dc2626" stroke-width="5"/><circle cx="200" cy="110" r="24" fill="#bfdbfe" stroke="#334155"/><text x="200" y="116" font-size="19" fill="#0f172a" text-anchor="middle">0</text><circle cx="350" cy="110" r="24" fill="#bfdbfe" stroke="#334155"/><text x="350" y="116" font-size="19" fill="#0f172a" text-anchor="middle">1</text><circle cx="440" cy="230" r="24" fill="#facc15" stroke="#334155"/><text x="440" y="236" font-size="19" fill="#0f172a" text-anchor="middle">3</text><circle cx="350" cy="350" r="24" fill="#bfdbfe" stroke="#334155"/><text x="350" y="356" font-size="19" fill="#0f172a" text-anchor="middle">7</text><circle cx="200" cy="350" r="24" fill="#facc15" stroke="#334155"/><text x="200" y="356" font-size="19" fill="#0f172a" text-anchor="middle">6</text><circle cx="110" cy="230" r="24" fill="#e2e8f0" stroke="#334155"/><text x="110" y="236" font-size="19" fill="#0f172a" text-anchor="middle">4</text><circle cx="600" cy="230" r="24" fill="#e2e8f0" stroke="#334155"/><text x="600" y="236" font-size="19" fill="#0f172a" text-anchor="middle">11</text><circle cx="200" cy="465" r="24" fill="#bfdbfe" stroke="#334155"/><text x="200" y="471" font-size="19" fill="#0f172a" text-anchor="middle">14</text><text x="510" y="380" font-size="16" fill="#0f172a" text-anchor="middle">Red: a valid 6-vertex induced path</text><text x="440" y="540" font-size="16" fill="#0f172a" text-anchor="middle">Both gold vertices belong to the whole C6 block, even when only one branch is chosen.</text><text x="400" y="575" font-size="17" fill="#b91c1c" text-anchor="middle">An unsafe partial-block count can incorrectly reduce the capacity to 4.</text></g></svg>
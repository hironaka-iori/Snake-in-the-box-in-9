<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="600" y="40" font-size="26" fill="#0f172a" text-anchor="middle">One Q9 branch: graph-theoretic capacity hierarchy</text><text x="600" y="78" font-size="18" fill="#0f172a" text-anchor="middle">The same 84-vertex prefix; a 235-edge target needs 153 suffix vertices.</text><text x="285" y="160" font-size="19" fill="#0f172a" text-anchor="end">Reachable region</text><rect x="310" y="135" width="742.5" height="38" rx="5" fill="#94a3b8"/><text x="1065.5" y="161" font-size="20" fill="#0f172a" text-anchor="start">165</text><text x="285" y="232" font-size="19" fill="#0f172a" text-anchor="end">Parity</text><rect x="310" y="207" width="738.0" height="38" rx="5" fill="#64748b"/><text x="1061.0" y="233" font-size="20" fill="#0f172a" text-anchor="start">164</text><text x="285" y="304" font-size="19" fill="#0f172a" text-anchor="end">Leaf peeling</text><rect x="310" y="279" width="697.5" height="38" rx="5" fill="#475569"/><text x="1020.5" y="305" font-size="20" fill="#0f172a" text-anchor="start">155</text><text x="285" y="376" font-size="19" fill="#0f172a" text-anchor="end">Whole-block chains</text><rect x="310" y="351" width="684.0" height="38" rx="5" fill="#2563eb"/><text x="1007.0" y="377" font-size="20" fill="#0f172a" text-anchor="start">152</text><text x="285" y="448" font-size="19" fill="#0f172a" text-anchor="end">Disjoint claws + endpoint</text><rect x="310" y="423" width="589.5" height="38" rx="5" fill="#059669"/><text x="912.5" y="449" font-size="20" fill="#0f172a" text-anchor="start">131</text><line x1="998.5" y1="115" x2="998.5" y2="482" stroke="#dc2626" stroke-width="2"/><text x="998.5" y="516" font-size="18" fill="#b91c1c" text-anchor="middle">Required: 153</text><text x="600" y="563" font-size="18" fill="#0f172a" text-anchor="middle">33 disjoint groups certify that at least 34 of the 165 residual vertices must be omitted.</text><text x="600" y="602" font-size="17" fill="#065f46" text-anchor="middle">Suffix &lt;=131 vertices implies &lt;=213 edges for THIS prefix. The global target remains UNKNOWN.</text></g></svg>